; Supervisor config for the queue worker.
; See ARCHITECTURE.md's "Deployment" section for the scheduler's cron entry.
;
; Install by copying (or symlinking) into /etc/supervisor/conf.d/, editing
; the paths and user below, then:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start kazsoft-project-manager-worker:*

[program:kazsoft-project-manager-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kazsoft/project-manager/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/kazsoft/project-manager
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/kazsoft/project-manager/storage/logs/queue-worker.log
stopwaitsecs=3600
